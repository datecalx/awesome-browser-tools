name: Tool Suggestion
description: Suggest a useful free online tool
title: "[Tool Suggestion]: "
labels:
  - tool-suggestion
body:
  - type: input
    id: name
    attributes:
      label: Tool Name
      placeholder: Example Tool
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Tool URL
      placeholder: https://example.com/
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Category
      placeholder: Calculators
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Briefly describe what the tool does.
    validations:
      required: true
